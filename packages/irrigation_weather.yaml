input_number:
  soil_capacity_mm:
    name: Boden Sättigung (Max)
    min: 10
    max: 40
    step: 1
    initial: 30

  soil_optimal_mm:
    name: Boden Optimal
    min: 5
    max: 30
    step: 1
    initial: 20

  soil_min_mm:
    name: Boden Minimum
    min: 0
    max: 30
    step: 1
    initial: 5
    

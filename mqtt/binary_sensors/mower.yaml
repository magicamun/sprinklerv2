  - name: "Robonect Online"
    state_topic: "greenkeeper/mqtt"
    unique_id: "robonect_online"
    device_class: connectivity
    device:
      identifiers: ["robonect_001"]
      name: "Robonect"
      model: "Greenkeeper"
      manufacturer: "Robonect"
    
  - name: "Robonect Garage Offen"

# ==================================================
# RainControl – Limits (Numeric Values)
# ==================================================

# ------------------------
# Unteres Limit
# ------------------------
- name: "RainControl Set Limit Low"
  state_topic: "RainControl/LimitLow"
  command_topic: "RainControl/cmd/Limit"
  unique_id: "raincontrol_set_limit_low"
  command_template: "low {{ value }}"
  unit_of_measurement: "L"
  min: 0
  max: 6500
  step: 1
  mode: slider
  device:
    identifiers:
      - raincontrol_001
    name: "RainControl"
    model: "Arduino Zisterne"
    manufacturer: "DIY"

